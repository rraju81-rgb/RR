<text class="small" x="61.258" y="103.220" text-anchor="middle" transform="rotate(-90.00 61.258 103.220)">B5</text>
<line class="bendU" x1="145.530" y1="95.720" x2="145.530" y2="112.720"/>
<text class="small" x="145.530" y="103.220" text-anchor="middle" transform="rotate(90.00 145.530 103.220)">B6</text>
<text class="small" x="14.000" y="160.441" text-anchor="start">1. Glue this sheet to 1 mm card (cereal-box card works) and cut round the solid outline. Cut out the slots if you like.</text>
<text class="small" x="14.000" y="165.041" text-anchor="start">2. Score the dash-dot lines. Green lines fold AWAY from you, the one red line (B6, the ear) folds TOWARDS you.</text>
<text class="small" x="14.000" y="169.641" text-anchor="start">3. Fold B7 and B8 to 90° to make the channel, B5 to close the tip, the four small tabs about 35° inwards,</text>
<text class="small" x="14.000" y="174.241" text-anchor="start">   and B6 so the ear stands square to the lamp.</text>
<text class="small" x="14.000" y="178.841" text-anchor="start">4. Slide it over the lamp from the tip. It should stop about 2 mm short of the tip, with about 1 mm play top and bottom</text>
<text class="small" x="14.000" y="183.441" text-anchor="start">   and 1.5 mm at the back (that space is for the foam liner). The tabs should sit on the sloped edge of the lens,</text>
<text class="small" x="14.000" y="188.041" text-anchor="start">   not on the lit face. The ear should land flat on the screw boss with the slot over the screw hole.</text>
<text class="small" x="14.000" y="192.641" text-anchor="start">5. Wherever it does not, measure the difference and change the matching value in cad/params.py (M1-M10),</text>
<text class="small" x="14.000" y="197.241" text-anchor="start">   then run build.py and drawing.py again. Only cut metal once the card version fits.</text>
<text class="small" x="14.000" y="201.841" text-anchor="start"></text>
<text class="small" x="14.000" y="206.441" text-anchor="start">Card folds sharp, steel bends on a 1.5 mm radius, so the card model runs about 0.4 mm larger inside. That is expected.</text>
<text class="small" x="14.000" y="285.000" text-anchor="start">Drg IC-390A-01 Rev A   lamp dimensions from photographs, unverified   Stainless steel 304, 1.5 mm, 2B</text>
</svg>
