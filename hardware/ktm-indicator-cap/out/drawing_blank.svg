<text class="small" x="292.000" y="91.000" text-anchor="start">Blank 118.3 x 84.4, area 5682 mm², cut length 563 mm, 8 pierces.</text>
<text class="small" x="292.000" y="95.400" text-anchor="start">Bend lines are bend centre lines.</text>
<text class="small" x="292.000" y="99.800" text-anchor="start">Bend allowance = angle x (R + K t), R 1.5, K 0.42.</text>
<text class="small" x="292.000" y="104.200" text-anchor="start">Adjust K to your tooling and re-run build.py;</text>
<text class="small" x="292.000" y="108.600" text-anchor="start">the inside dimensions are held, the blank changes.</text>
<text class="small" x="292.000" y="113.000" text-anchor="start">Form tabs B1-B4 first, then B5, B6, then the two</text>
<text class="small" x="292.000" y="117.400" text-anchor="start">long bends B7, B8 over a 21.6 mm form block or with</text>
<text class="small" x="292.000" y="121.800" text-anchor="start">a gooseneck punch (channel is deeper than it is wide).</text>
<text class="small" x="292.000" y="126.200" text-anchor="start">Tabs may be trimmed to the lamp by hand with</text>
<text class="small" x="292.000" y="130.600" text-anchor="start">pliers after the liner is fitted.</text>
<text class="small" x="292.000" y="135.000" text-anchor="start">Grain along the long bends if the sheet allows.</text>
</svg>
