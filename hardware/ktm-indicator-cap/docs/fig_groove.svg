<polygon class="arrow" points="71.600,178.400 74.432,186.181 68.768,186.181"/>
<text class="dimtxt" x="67.460" y="207.200" text-anchor="middle" transform="rotate(-90.00 67.460 207.200)">2.4 wall</text>
<line class="dim" x1="306.320" y1="236.000" x2="338.520" y2="236.000"/>
<line class="dim" x1="306.320" y1="221.600" x2="338.520" y2="221.600"/>
<line class="dim" x1="333.000" y1="236.000" x2="333.000" y2="221.600"/>
<polygon class="arrow" points="333.000,236.000 330.168,228.219 335.832,228.219"/>
<polygon class="arrow" points="333.000,221.600 335.832,229.381 330.168,229.381"/>
<text class="dimtxt" x="328.860" y="228.800" text-anchor="middle" transform="rotate(-90.00 328.860 228.800)">0.6 web</text>
<line class="dim" x1="180.560" y1="194.528" x2="163.500" y2="89.000"/>
<polygon class="arrow" points="180.560,194.528 177.196,188.504 181.855,187.751"/>
<text class="dimtxt" x="20.000" y="84.000" text-anchor="start">V-groove: opening angle = fold angle + 2°</text>
<line class="dim" x1="202.880" y1="229.520" x2="90.000" y2="307.000"/>
<polygon class="arrow" points="202.880,229.520 198.870,235.135 196.199,231.244"/>
<text class="dimtxt" x="20.000" y="322.000" text-anchor="start">the web is the hinge</text>
<text class="label" x="440.000" y="26.000" text-anchor="start">FOLDED</text>
<polygon class="steel" points="509.200,252.000 610.000,252.000 610.000,237.600 566.800,194.400 509.200,194.400"/>
<polygon class="steel" points="624.400,237.600 624.400,136.800 566.800,136.800 566.800,194.400 610.000,237.600"/>
<line class="dim" x1="566.800" y1="194.400" x2="610.000" y2="237.600"/>
<line class="dim" x1="565.600" y1="193.200" x2="559.000" y2="89.000"/>
<polygon class="arrow" points="565.600,193.200 562.835,186.878 567.545,186.580"/>
<text class="dimtxt" x="440.000" y="84.000" text-anchor="start">fold stops here, at the bend angle</text>
<line class="dim" x1="588.400" y1="216.000" x2="541.500" y2="323.000"/>
<polygon class="arrow" points="588.400,216.000 587.958,222.886 583.636,220.991"/>
<text class="dimtxt" x="440.000" y="338.000" text-anchor="start">closed groove: glue this seam</text>
<line class="dim" x1="620.800" y1="249.120" x2="665.000" y2="285.000"/>
<polygon class="arrow" points="620.800,249.120 627.321,251.374 624.347,255.039"/>
<text class="dimtxt" x="560.000" y="300.000" text-anchor="start">web stretches round the corner</text>
<text class="small" x="20.000" y="362.000" text-anchor="start">Fold every groove until it closes. Grooves on the top face fold up; the ear's groove is underneath and folds down.</text>
</svg>
